# coturn 설정 — 시간제한 임시 자격증명(use-auth-secret) 방식
# 서버(.env 의 TURN_STATIC_SECRET)와 static-auth-secret 이 반드시 동일해야 합니다.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech

# ── 임시 자격증명 방식 ──
use-auth-secret
static-auth-secret=REPLACE_WITH_SAME_SECRET_AS_SERVER

# 도메인(리얼름). 서버 도메인과 맞추세요.
realm=call.example.com

# VPS 공인 IP (도커/NAT 뒤에서는 필수)
external-ip=REPLACE_WITH_PUBLIC_IP

# 릴레이 포트 범위 (방화벽에서 UDP 로 열어야 함)
min-port=49152
max-port=65535

no-tcp-relay
stale-nonce=600
no-multicast-peers

# 보안: 사설망/루프백으로의 릴레이 차단 (SSRF 방지)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# 로그를 표준출력으로 (docker logs 로 확인)
log-file=stdout
simple-log
